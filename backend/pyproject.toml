[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visionforge-backend"
version = "1.0.0"
description = "VisionForge Machine Vision Platform - Backend Services"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi[all]>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "starlette>=0.37.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",

    # Config & Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Object Storage
    "minio>=7.2.0",
    "boto3>=1.34.0",

    # Task Queue
    "celery[redis]>=5.3.6",
    "redis>=5.0.0",

    # Image Processing
    "Pillow>=10.3.0",
    "imagehash>=4.3.1",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "albumentations>=1.4.0",

    # ML / Training
    "mlflow>=2.12.0",
    "pyyaml>=6.0.1",

    # Monitoring
    "prometheus-fastapi-instrumentator>=7.0.0",

    # Utilities
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
training = [
    "ultralytics>=8.2.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "supervision>=0.20.0",
    "timm>=0.9.0",
]

inference = [
    "onnxruntime>=1.17.0",
    "onnxruntime-gpu>=1.17.0",
]

ai-assist = [
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
]

dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
