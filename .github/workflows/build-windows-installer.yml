name: Build Windows Installer

on:
  push:
    tags:
      - "v*.*.*"          # trigger on version tags, e.g. v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.2.3)"
        required: false
        default: "1.0.0"

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build-installer:
    name: Compile VisionForge-Setup.exe
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Determine version ─────────────────────────────────────────────────
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $v = "${{ github.event.inputs.version }}"
            if (-not $v) { $v = "1.0.0" }
          }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          echo "Resolved version: $v"

      # ── Install NSIS ──────────────────────────────────────────────────────
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          # Refresh PATH so makensis.exe is found
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine")
          makensis /VERSION

      # ── Build installer ───────────────────────────────────────────────────
      - name: Build installer
        shell: pwsh
        run: |
          Set-Location installer\windows
          .\build.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      # ── Verify output ─────────────────────────────────────────────────────
      - name: Verify output file
        shell: pwsh
        run: |
          $exe = "installer\windows\VisionForge-Setup-${{ steps.version.outputs.VERSION }}.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Installer not found at $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Installer size: $([math]::Round($size, 1)) MB"

      # ── Upload artifact (all runs) ────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionForge-Setup-${{ steps.version.outputs.VERSION }}
          path: installer/windows/VisionForge-Setup-${{ steps.version.outputs.VERSION }}.exe
          retention-days: 30

      # ── Create GitHub Release (tag pushes only) ───────────────────────────
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VisionForge ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: installer/windows/VisionForge-Setup-${{ steps.version.outputs.VERSION }}.exe
          body: |
            ## VisionForge ${{ steps.version.outputs.VERSION }} — Windows Installer

            ### One-click install
            1. Download **VisionForge-Setup-${{ steps.version.outputs.VERSION }}.exe** below
            2. Run it as Administrator
            3. The installer checks for Docker Desktop, optionally enables GPU support,
               and starts all services automatically
            4. Open **http://localhost** when setup completes

            ### Requirements
            - Windows 10 (21H2) / Windows 11 — 64-bit
            - 8 GB RAM minimum, 16 GB recommended
            - 20 GB free disk space (for Docker images and model cache)
            - NVIDIA GPU + driver ≥ 527.41 (optional, for GPU training)

            ### What's included
            See [RELEASE_NOTES.txt](installer/windows/RELEASE_NOTES.txt) for details.
