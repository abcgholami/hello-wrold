version: "3.9"

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: visionforge
      POSTGRES_USER: visionforge
      POSTGRES_PASSWORD: visionforge_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: visionforge
      MINIO_ROOT_PASSWORD: visionforge_secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri postgresql://visionforge:visionforge_secret@postgres:5432/visionforge
        --default-artifact-root s3://visionforge-mlflow/
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: visionforge
      AWS_SECRET_ACCESS_KEY: visionforge_secret
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Backend Services ────────────────────────────────────────────────────────
  core_api:
    build:
      context: ../backend
      dockerfile: core_api/Dockerfile
    restart: unless-stopped
    command: uvicorn core_api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://visionforge:visionforge_secret@postgres:5432/visionforge
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: visionforge
      MINIO_SECRET_KEY: visionforge_secret
      MINIO_BUCKET: visionforge-media
      JWT_SECRET: super-secret-jwt-key-change-in-production
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  train_api:
    build:
      context: ../backend
      dockerfile: train_api/Dockerfile
    restart: unless-stopped
    command: uvicorn train_api.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://visionforge:visionforge_secret@postgres:5432/visionforge
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: visionforge
      MINIO_SECRET_KEY: visionforge_secret
      MINIO_BUCKET: visionforge-media
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: visionforge
      AWS_SECRET_ACCESS_KEY: visionforge_secret
    volumes:
      - ../backend:/app
      - model_cache:/root/.cache
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  infer_api:
    build:
      context: ../backend
      dockerfile: infer_api/Dockerfile
    restart: unless-stopped
    command: uvicorn infer_api.main:app --host 0.0.0.0 --port 8002 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://visionforge:visionforge_secret@postgres:5432/visionforge
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: visionforge
      MINIO_SECRET_KEY: visionforge_secret
      MINIO_BUCKET: visionforge-media
    volumes:
      - ../backend:/app
      - model_cache:/root/.cache
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ../backend
      dockerfile: train_api/Dockerfile
    restart: unless-stopped
    command: celery -A train_api.workers.celery_app worker --loglevel=info -Q default,export
    environment:
      DATABASE_URL: postgresql+asyncpg://visionforge:visionforge_secret@postgres:5432/visionforge
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: visionforge
      MINIO_SECRET_KEY: visionforge_secret
      MINIO_BUCKET: visionforge-media
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: visionforge
      AWS_SECRET_ACCESS_KEY: visionforge_secret
    volumes:
      - ../backend:/app
      - model_cache:/root/.cache
      - /tmp/visionforge:/tmp/visionforge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_gpu_worker:
    build:
      context: ../backend
      dockerfile: train_api/Dockerfile.gpu
    restart: unless-stopped
    command: celery -A train_api.workers.celery_app worker --loglevel=info -Q gpu_training
    environment:
      DATABASE_URL: postgresql+asyncpg://visionforge:visionforge_secret@postgres:5432/visionforge
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: visionforge
      MINIO_SECRET_KEY: visionforge_secret
      MINIO_BUCKET: visionforge-media
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: visionforge
      AWS_SECRET_ACCESS_KEY: visionforge_secret
    volumes:
      - ../backend:/app
      - model_cache:/root/.cache
      - /tmp/visionforge:/tmp/visionforge
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai_assist:
    build:
      context: ../backend
      dockerfile: ai_assist/Dockerfile
    restart: unless-stopped
    command: uvicorn ai_assist.main:app --host 0.0.0.0 --port 8003 --reload
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: visionforge
      MINIO_SECRET_KEY: visionforge_secret
      MINIO_BUCKET: visionforge-media
      SAM2_MODEL: sam2_hiera_large
    volumes:
      - ../backend:/app
      - model_cache:/root/.cache
    ports:
      - "8003:8003"
    depends_on:
      minio:
        condition: service_healthy

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_CORE_API_URL: http://localhost:8000
      VITE_TRAIN_API_URL: http://localhost:8001
      VITE_INFER_API_URL: http://localhost:8002
      VITE_AI_ASSIST_URL: http://localhost:8003

  # ── Reverse Proxy ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - core_api
      - train_api
      - infer_api
      - frontend

  # ── Monitoring ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:
  prometheus_data:
  grafana_data:
