events {
    worker_connections 1024;
}

http {
    upstream core_api    { server core_api:8000; }
    upstream train_api   { server train_api:8001; }
    upstream infer_api   { server infer_api:8002; }
    upstream ai_assist   { server ai_assist:8003; }
    upstream frontend    { server frontend:3000; }
    upstream minio       { server minio:9000; }

    # Proxy cache for MinIO thumbnails
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:10m max_size=1g inactive=60m;

    server {
        listen 80;

        # API routes
        location /api/core/   { proxy_pass http://core_api/;  include /etc/nginx/proxy_params; }
        location /api/train/  { proxy_pass http://train_api/; include /etc/nginx/proxy_params; }
        location /api/infer/  { proxy_pass http://infer_api/; include /etc/nginx/proxy_params; }
        location /api/ai/     { proxy_pass http://ai_assist/; include /etc/nginx/proxy_params; }

        # WebSocket upgrade for training progress and live inference
        location /ws/ {
            proxy_pass http://core_api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        location /ws/training/ {
            proxy_pass http://train_api/ws/training/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        location /ws/infer/ {
            proxy_pass http://infer_api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # MinIO media with caching
        location /media/ {
            proxy_pass http://minio/visionforge-media/;
            proxy_cache media_cache;
            proxy_cache_valid 200 1d;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend/;
            include /etc/nginx/proxy_params;
        }
    }
}
